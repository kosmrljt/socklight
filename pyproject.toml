[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socklight"
version = "0.2.0"
description = "SOCKS5 development proxy with live terminal dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.4",
    "pyperclip>=1.8",
    "textual>=0.70",
    "uvloop>=0.19; sys_platform == 'linux'",
]

[project.scripts]
socklight = "socklight.cli:main"

[project.urls]
Repository = "https://github.com/kosmrljt/socklight"

[tool.setuptools.packages.find]
include = ["socklight*"]

[tool.setuptools.package-data]
socklight = ["data/*.toml"]
