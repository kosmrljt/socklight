[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socklight"
version = "0.1.0"
description = "SOCKS5 development proxy with live terminal dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anyio[trio]>=4.4",
    "textual>=0.70",
]

[project.scripts]
socklight = "proxy.cli:main"

[project.urls]
Repository = "https://github.com/kosmrljt/socklight"

[tool.setuptools.packages.find]
include = ["proxy*"]

[tool.setuptools.package-data]
proxy = ["data/*.toml"]
