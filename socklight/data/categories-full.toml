# =======================================================================
# CLOUD HOSTING — jurisdiction of the PROVIDER only!
# The tenant behind these hostnames is unknown: anything from a
# legitimate API to a tracker can run on them. Treat as "data goes to
# CN/US infrastructure, content unknown". Specific known services on
# these clouds (e.g. dashscope.aliyuncs.com) are caught by exact
# patterns in their own categories.
# =======================================================================

[categories.cloud_cn]
color       = "red3"
abbrev      = "CLCN"
description = "Chinese cloud infrastructure — tenant unknown, CN jurisdiction"
severity    = "medium"
geo_hint    = "CN"
patterns = [
    # Alibaba Cloud
    "*.aliyuncs.com",
