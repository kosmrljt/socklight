# =======================================================================
# FUNCTIONAL SERVICES — needed for pages to work.  All MUST precede the
# jurisdiction_* catch-alls so provider-owned functional endpoints
# (Google Fonts, Cloudflare Turnstile, Google/Apple Pay) are labelled by
# function, not by the parent company's flag.
# =======================================================================
[categories.fonts]
color       = "cornflower_blue"
abbrev      = "FNT"
description = "Web font services — downloads typefaces for page rendering"
severity    = "low"
patterns = [
    # Google Fonts
    "fonts.googleapis.com", "fonts.gstatic.com",
    # Adobe Fonts (Typekit)
