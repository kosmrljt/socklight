[categories.ai_apis_us]
color       = "spring_green3"
abbrev      = "AIUS"
description = "US AI service APIs — CLOUD Act jurisdiction"
severity    = "medium"
geo_hint    = "US"
patterns = [
    # OpenAI / ChatGPT
    "api.openai.com",
    "*.openai.com",
    "chatgpt.com",
    "*.chatgpt.com",
    "*.oaistatic.com",
    "*.oaiusercontent.com",
    # Anthropic / Claude
    "api.anthropic.com",
    "*.anthropic.com",
    "claude.ai",
    "*.claude.ai",
    # Google AI
    "generativelanguage.googleapis.com",
    "aiplatform.googleapis.com",
    "gemini.google.com",
    # GitHub Copilot
    "api.githubcopilot.com",
    "*.githubcopilot.com",
    "copilot-proxy.githubusercontent.com",
    # Microsoft Copilot / Azure OpenAI
    # (note: Azure OpenAI *deployments* can live in EU regions, but the
    #  provider is US — CLOUD Act applies regardless of region)
    "copilot.microsoft.com",
    "*.copilot.microsoft.com",
    "sydney.bing.com",
    "*.openai.azure.com",
    "*.cognitiveservices.azure.com",
    "*.services.ai.azure.com",
    # xAI / Grok
    "api.x.ai",
    # Perplexity
    "*.perplexity.ai",
    # Groq
    "*.groq.com",
    # Cohere (HQ Canada — PIPEDA, EU adequacy)
    "api.cohere.com",
    "*.cohere.ai",
    # Together / Fireworks / Replicate (inference hosting)
    "*.together.ai",
    "api.together.xyz",
    "*.fireworks.ai",
    "*.replicate.com",
    "api.replicate.com",
    # OpenRouter (aggregator — routes to MANY providers, incl. CN-hosted!)
    "openrouter.ai",
    "*.openrouter.ai",
    # Hugging Face (HQ New York)
    "huggingface.co",
    "*.huggingface.co",
    "*.hf.co",
    # Ollama (US — model registry pulls + version checks)
    "ollama.com",
    "*.ollama.com",
    "registry.ollama.ai",
    "*.ollama.ai",
]

