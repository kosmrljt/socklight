]

# =======================================================================
# OS TELEMETRY & UPDATES
#   NOTE: blocking OS *updates* is generally NOT advised — you lose security
#   patches.  Kept at low severity precisely so a broad "deny high/medium"
#   sweep does not silently break patching.  Block deliberately if at all.
# =======================================================================
[categories.telemetry_os]
color       = "dark_goldenrod"
abbrev      = "TLO"
description = "OS telemetry & update checks — blocking updates is not advised"
severity    = "low"
patterns = [
    # Windows / Microsoft
    "settings-win.data.microsoft.com", "v10.events.data.microsoft.com", "v20.events.data.microsoft.com",
    "*.events.data.microsoft.com", "watson.telemetry.microsoft.com", "*.telemetry.microsoft.com",
    "*.update.microsoft.com", "*.windowsupdate.com", "dl.delivery.mp.microsoft.com",
    # Apple
    "mesu.apple.com", "gdmf.apple.com", "xp.apple.com",
    "swscan.apple.com", "swcdn.apple.com", "swdist.apple.com",
    # Linux distro repos (containers/VMs) — blocking wastes rebuild time, not privacy
    "*.fedoraproject.org", "dl.fedoraproject.org", "download.fedoraproject.org", "mirrors.fedoraproject.org",
    "*.rpmfusion.org", "mirrors.rpmfusion.org", "download1.rpmfusion.org",
    "*.archive.ubuntu.com", "security.ubuntu.com", "deb.debian.org", "*.centos.org"
]

# =======================================================================
# AI SERVICE APIs — graded by GDPR adequacy of the provider's jurisdiction
#   Shows which app talks to which AI provider and under which legal regime.
#   MUST precede the jurisdiction_* catch-alls (a Gemini/Copilot endpoint is
#   otherwise eaten by *.google.com / *.microsoft.com and mislabelled).
# =======================================================================
[categories.ai_apis_eu]
color       = "green3"
abbrev      = "AIEU"
description = "AI APIs in EU/EEA — GDPR home jurisdiction"
severity    = "low"
geo_hint    = "EU"
patterns = [
    # Mistral (FR)
    "api.mistral.ai", "*.mistral.ai", "chat.mistral.ai",
    # Aleph Alpha (DE)
    "*.aleph-alpha.com", "api.aleph-alpha.com",
    # Black Forest Labs / FLUX (DE)
    "*.bfl.ai", "*.bfl.ml",
    # DeepL (DE)
    "deepl.com", "*.deepl.com", "api.deepl.com"
]

[categories.ai_apis_adequacy]
color       = "light_sea_green"
abbrev      = "AIAD"
description = "AI APIs in adequacy countries (UK/CH/JP/IL/KR…) — Art. 45 GDPR adequacy"
severity    = "low"
geo_hint    = "AD"
patterns = [
    # Stability AI (UK — UK GDPR + adequacy)
    "*.stability.ai", "api.stability.ai",
    # Japan (adequacy decision)
    "sakana.ai", "*.sakana.ai", "*.preferred.jp", "*.plamo.jp",
    # Israel (adequacy decision)
    "ai21.com", "*.ai21.com", "api.ai21.com"
]

[categories.ai_apis_us]
color       = "orange3"
abbrev      = "AIUS"
description = "AI APIs in the US — CLOUD Act; partial adequacy via Data Privacy Framework"
severity    = "medium"
geo_hint    = "US"
patterns = [
    # OpenAI / ChatGPT
    "api.openai.com", "*.openai.com", "chatgpt.com", "*.chatgpt.com", "*.oaistatic.com", "*.oaiusercontent.com",
