# sockLight — SOCKS5 Dev Proxy — Connection Categories (Neutral / Adequacy Edition)
# ================================================================================
#
# NEUTRALITY MODEL — GDPR adequacy, not country stereotypes
#   Geographic categories are graded by the EU legal test that already exists,
#   not by hand-picked "good vs bad" countries.  Article 45 GDPR lets the
#   European Commission recognise a non-EU country as offering adequate data
#   protection.  That gives three OBJECTIVE tiers:
#     • EU/EEA .............. domestic jurisdiction        (low)
#     • Adequacy ............ Commission adequacy decision  (low)
#         UK, CH, JP, IL, KR, CA, NZ, AR, UY, and others
#     • No adequacy ......... processed outside that regime (medium)
#         US (partial: Data Privacy Framework — see note), CN, RU, and the
#         jurisdiction_other catch-all for everything else
#   US and CN carry the SAME severity and the SAME colour on purpose — the
#   file makes no claim that one is worse than the other.  The only asymmetry
#   is factual: the US has a (contested) DPF adequacy bridge, noted in-line.
#
# MATCHING SEMANTICS — first-match-wins by definition order:
#   The order of [categories.*] sections in this file MATTERS.
#   The classifier is strictly first-match-wins (see proxy/classifier.py):
#   there is NO "most-specific-wins" logic.  Therefore more-specific
#   categories MUST be listed before broad catch-alls, or the catch-all
#   swallows them.  Concretely:
#     • Every functional category (ai_apis_*, fonts, captcha, payment,
#       video_embed, cdn, cloud_*) MUST come before the jurisdiction_*
#       catch-alls at the bottom — otherwise e.g. fonts.googleapis.com is
#       eaten by *.google.com and shown as a US platform, not FNT.
#     • captcha MUST come before cdn, or challenges.cloudflare.com is eaten
#       by *.cloudflare.com and shown as CDN instead of CAP.
#
# The classifier builds a two-level trie (TLD → domain) for fast lookup:
#     1. Two dict lookups select a small candidate bucket (~10–20 patterns).
#     2. Each candidate RE is tested in definition order — first match wins.
#     3. Patterns with a wildcard in the TLD or second-level label (e.g.
#        "*.google.com.*", "*.amazon.*") cannot be indexed — they go to a
#        fallback list checked only when the trie bucket finds nothing.
#   Examples:
#     fonts.googleapis.com  -> fonts        (exact before *.googleapis.com)
#     analytics.tiktok.com  -> social_tracking (exact before *.tiktok.com)
#     abc.google.com        -> jurisdiction_us (*.google.com catch-all)
#
# Each category:
#   color       Rich/Textual colour name shown in the TUI
#   abbrev      3–5 char label shown in the connection table
#   description Short human-readable explanation
#   severity    high | medium | low | info  — for sorting/filtering in TUI
#   geo_hint    Optional two-letter country code shown in the Categories panel
#   patterns    List of fnmatch hostname patterns (* matches any string)
#
# TUI commands:
#   deny   @<name|abbrev>    block all connections in this category
#   allow  @<name|abbrev>    explicitly allow (useful in allowlist mode)
#   remove @<name|abbrev>    clear override — back to default allow
#   F2                       show all categories with current status
#
# To add your own categories: append a new [categories.mycat] section.
# --------------------------------------------------------------------------------

# =======================================================================
# HIGH SEVERITY — invasive tracking & profiling (behaviour, not geography)
# =======================================================================
[categories.fingerprinting]
color       = "red1"
abbrev      = "FPR"
description = "Device fingerprinting & bot-detection — identifies you without cookies"
severity    = "high"
patterns = [
    # FingerprintJS
    "fingerprint.com", "*.fingerprint.com", "fpjs.io", "*.fpjs.io", "api.fpjs.io",
    # PerimeterX (HUMAN Security)
    "*.fptls.com", "*.perimeterx.net", "*.px-cdn.net", "*.px-cloud.net", "*.pxchk.net", "*.humansecurity.com",
    # DataDome
    "*.datadome.co", "captcha-delivery.com", "*.captcha-delivery.com",
    # Castle / Sift / Forter / Riskified
    "*.castle.io", "*.siftscience.com", "*.sift.com", "cdn.sift.com", "*.forter.com", "*.riskified.com",
    # Seon / Iovation / ThreatMetrix
    "*.seon.io", "*.iovation.com", "*.threatmetrix.com", "*.online-metrix.net"
]

[categories.session_recording]
