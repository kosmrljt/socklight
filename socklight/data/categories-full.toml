# =======================================================================
# CLOUD INFRASTRUCTURE — jurisdiction of the PROVIDER / REGION only.
#   Tenant is unknown; a hit means "hosted here", not "owned by them".
#   Region-pinned buckets (eu-west-1, europe-west1) MUST come before the
#   provider-wide *.amazonaws.com / *.googleapis.com so an EU region isn't
#   swallowed by the generic US bucket.
# =======================================================================
[categories.cloud_eu]
color       = "green3"
abbrev      = "CLEU"
description = "EU/EEA cloud infrastructure — GDPR home jurisdiction"
severity    = "low"
geo_hint    = "EU"
patterns = [
    # Hetzner (DE)
    "*.hetzner.com", "*.hetzner.cloud", "*.hetzner.io",
    # OVHcloud (FR)
    "*.ovh.com", "*.ovh.net", "*.ovhcloud.com",
    # Scaleway (FR)
    "*.scaleway.com", "*.scaleway.io",
    # UpCloud (FI)
    "*.upcloud.com", "*.upcloud.io",
    # AWS EU regions
    "*.eu-west-1.amazonaws.com", "*.eu-central-1.amazonaws.com", "*.eu-west-2.amazonaws.com", "*.eu-west-3.amazonaws.com", "*.eu-north-1.amazonaws.com", "*.eu-south-1.amazonaws.com",
    # Azure EU regions
    "*.westeurope.azurewebsites.net", "*.northeurope.azurewebsites.net", "*.westeurope.cloudapp.azure.com", "*.northeurope.cloudapp.azure.com",
    # Google Cloud EU regions
    "*.europe-west1.googleapis.com", "*.europe-west3.googleapis.com", "*.europe-west4.googleapis.com", "*.europe-north1.googleapis.com"
]

[categories.cloud_adequacy]
color       = "light_sea_green"
abbrev      = "CLAD"
description = "Cloud infra in adequacy countries (CH/UK…) — Art. 45 GDPR adequacy"
severity    = "low"
