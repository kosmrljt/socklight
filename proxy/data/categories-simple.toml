# sockLight — SOCKS5 Dev Proxy — Connection Categories
# ==========================================
#
# Categories are checked in ORDER — first match wins.
# Put more-specific categories BEFORE broad catch-alls.
#
# Each category:
#   color       Rich/Textual colour name shown in the TUI
#   abbrev      3–5 char label shown in the connection table
#   description Short human-readable explanation
#   block       true = block by default at startup (can toggle in TUI)
#   geo_hint    Two-letter country code shown in the Categories panel
#   patterns    List of fnmatch hostname patterns (* matches any string)
#
# TUI commands:
#   block   <name>    block all connections in this category
#   unblock <name>    allow them again
#   cats              list all categories with current status
#
# To add your own categories: append a new [categories.mycat] section.
# -----------------------------------------------------------------------

